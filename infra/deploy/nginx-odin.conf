# Reverse-proxy snippet for the CloudPanel site odin.iamcanturk.dev.
#
# Paste these two location blocks into the site's Vhost editor
# (CloudPanel → Sites → odin.iamcanturk.dev → Vhost), inside the server {} block.
# CloudPanel manages the server{}, SSL and listen directives — do NOT duplicate those.
#
#   /       → Next.js  (127.0.0.1:3000)
#   /api/   → FastAPI  (127.0.0.1:8000)

location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
