# Local development backing services ONLY.
# Production runs on native CloudPanel (Postgres + Redis managed there) — see infra/deploy/.
#
#   docker compose -f infra/docker-compose.dev.yml up -d
#
# Values come from the root .env (copy .env.example -> .env).

name: odin-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: odin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odin}
      POSTGRES_DB: ${POSTGRES_DB:-odin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odin} -d ${POSTGRES_DB:-odin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: odin-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
