<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ODIN</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #0a0c10;
        color: #e6e9ef;
        margin: 0;
        padding: 16px;
        width: 240px;
      }
      h1 { font-size: 13px; letter-spacing: 0.25em; margin: 0 0 12px; }
      .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; font-size: 13px; }
      .muted { color: #8b93a3; }
      button {
        padding: 6px 10px; border-radius: 6px; border: 1px solid #232833;
        background: transparent; color: #e6e9ef; font-size: 12px; cursor: pointer;
      }
      #toggle.on { border-color: #37d39b66; color: #37d39b; }
      #open-options { width: 100%; margin-top: 12px; border-color: #4f9dff66; color: #4f9dff; }
    </style>
  </head>
  <body>
    <h1>ODIN X COLLECTOR</h1>
    <div class="row">
      <span class="muted">Capturing</span>
      <button id="toggle">…</button>
    </div>
    <div class="row">
      <span class="muted">Posts sent</span>
      <span id="sent">0</span>
    </div>
    <div class="row">
      <span class="muted">Status</span>
      <span id="status" style="font-size: 11px; max-width: 150px; text-align: right;">…</span>
    </div>
    <label style="display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12px; color:#8b93a3;">
      <input type="checkbox" id="badges" />
      Tweetlerde hız rozeti göster
    </label>

    <button id="backfill" style="width: 100%; margin-top: 6px; border-color: #5aa2ff66; color: #5aa2ff;">
      Tüm geçmiş tweetlerimi çek
    </button>
    <div id="backfill-result" class="muted" style="font-size: 11px; margin-top: 4px; text-align: center;"></div>

    <button id="sync-now" style="width: 100%; margin-top: 6px; border-color: #3dd4a066; color: #3dd4a0;">
      Tweetlerimi şimdi çek
    </button>
    <div id="sync-result" class="muted" style="font-size: 11px; margin-top: 6px; text-align: center;"></div>

    <hr style="border: 0; border-top: 1px solid #232833; margin: 14px 0 10px;" />
    <div class="muted" style="font-size: 11px; margin-bottom: 6px;">
      On someone's profile? Sample their style:
    </div>
    <button id="sample-style" style="width: 100%; border-color: #f2c14e66; color: #f2c14e;">
      Take style sample
    </button>
    <div id="sample-result" class="muted" style="font-size: 11px; margin-top: 6px; text-align: center;"></div>
    <button id="open-options">Settings</button>
    <script src="popup.js"></script>
  </body>
</html>
