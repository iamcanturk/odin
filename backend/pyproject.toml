[project]
name = "odin-backend"
version = "0.1.0"
description = "ODIN backend — ingestion, event clustering, trend scoring, API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "arq>=0.26",
    "redis>=5.2",
    "httpx>=0.27",
    "feedparser>=6.0",
    "openai>=1.55",
    "python-dotenv>=1.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Heavy ML deps (torch etc.) — installed when the embedding provider lands (issue #8).
ml = [
    "sentence-transformers>=3.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic migration bodies are autogenerated; don't lint their formatting.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are meant to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
